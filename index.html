<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a"><title>Pain Log</title>
<style>
:root{--bg:#0d1016;--card:#171b24;--line:#2a3040;--text:#f4f6fa;--muted:#9da6b7;--accent:#8b7cff;--danger:#ff5c70;--ok:#4bd39b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:13px}.status{font-size:12px;color:var(--ok)}button{font:inherit;color:var(--text);border:0;cursor:pointer}.hero{background:linear-gradient(145deg,#1c2030,#141821);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}.painrow{display:flex;gap:10px;align-items:center}.paininput{width:120px;background:#0c0f15;border:1px solid var(--line);color:white;border-radius:16px;font-size:38px;font-weight:800;text-align:center;padding:8px}.logpain{flex:1;min-height:76px;border-radius:18px;background:var(--danger);font-size:22px;font-weight:800}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.quick button{background:#222838;border:1px solid #333b4d;border-radius:13px;padding:11px 4px;font-weight:700}.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}.section h2{font-size:15px;margin:0 0 10px}.meds{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.med{background:#242a39;border:1px solid #343c50;border-radius:15px;padding:14px;text-align:left;min-height:66px}.med strong{display:block;font-size:16px}.med span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.voice{display:flex;gap:9px}.voice button{flex:1;border-radius:15px;background:#282f40;padding:15px;font-weight:750}.voice button.recording{background:var(--danger)}textarea{width:100%;background:#0e1118;color:white;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:80px;resize:vertical}.actions{display:flex;gap:9px;margin-top:10px}.actions button{flex:1;background:#242a39;border-radius:14px;padding:12px}.history{display:flex;flex-direction:column;gap:8px}.event{border:1px solid var(--line);border-radius:15px;padding:12px;background:#131720}.eventtop{display:flex;justify-content:space-between;gap:10px}.event b{font-size:15px}.event small{color:var(--muted)}.pill{display:inline-block;margin-top:7px;margin-right:5px;padding:4px 8px;border-radius:9px;background:#252c3c;font-size:12px}.empty{color:var(--muted);text-align:center;padding:16px}.danger{color:#ff9aa7}.footer{display:flex;gap:8px;margin-top:12px}.footer button{background:transparent;color:var(--muted);padding:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#f4f6fa;color:#111;padding:11px 16px;border-radius:13px;font-weight:700;display:none;z-index:5}@media(max-width:430px){.paininput{width:94px}.quick{grid-template-columns:repeat(4,1fr)}.meds{grid-template-columns:1fr 1fr}}
</style></head>
<body><main>
<div class="top"><div><div class="title">Pain Log</div><div class="sub">Tap what happened. No typing required.</div></div><div class="status" id="saveState">Saved locally</div></div>
<section class="hero"><div class="painrow"><input id="pain" class="paininput" inputmode="numeric" type="number" min="0" max="100" value="10" aria-label="Pain level"><button class="logpain" id="logPain">LOG PAIN</button></div><div class="quick"><button data-pain="5">5</button><button data-pain="7">7</button><button data-pain="10">10</button><button data-pain="30">30+</button></div></section>
<section class="section"><h2>Medication taken</h2><div class="meds" id="meds"></div></section>
<section class="section"><h2>Voice / episode evidence</h2><div class="voice"><button id="voiceBtn">🎙️ Hold to record voice</button><button id="speechBtn">🗣️ Start speech note</button></div><div style="margin-top:9px"><textarea id="note" placeholder="Optional note. You can leave this blank."></textarea></div><div class="actions"><button id="saveNote">Save note</button><button id="clearToday">Clear today's data</button></div></section>
<section class="section"><h2>Today</h2><div id="history" class="history"></div></section>
<div class="footer"><button id="export">Export diary</button><button id="deleteAll">Delete all local data</button></div>
</main><div class="toast" id="toast"></div>
<script>
const KEY='painlog.v1';
const meds=[['Pregabalin','1 dose'],['Ibuprofen','1 dose'],['Norflex','1 dose'],['Codeine','1 dose'],['Other','1 dose']];
let data=JSON.parse(localStorage.getItem(KEY)||'[]'); let mediaRecorder=null, chunks=[], recognition=null;
const $=id=>document.getElementById(id);
function now(){return new Date().toISOString()}
function fmt(iso){return new Date(iso).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('saveState').textContent='Saved locally'}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function add(type,extra={}){data.push({id:crypto.randomUUID(),time:now(),type,...extra});save();render();toast(type==='pain'?'Pain logged':'Logged')}
function render(){const h=$('history'); if(!data.length){h.innerHTML='<div class="empty">Nothing logged yet.</div>';return}h.innerHTML=data.slice().reverse().map(e=>{let label=e.type==='pain'?`Pain ${e.level}`:e.type==='med'?`${e.med} dose`:e.type==='voice'?'Voice recording':e.type==='note'?'Note':'Event';return `<div class="event"><div class="eventtop"><b>${label}</b><small>${fmt(e.time)}</small></div>${e.text?`<div style="margin-top:7px;white-space:pre-wrap">${escapeHtml(e.text)}</div>`:''}${e.level?`<span class="pill">Pain level ${e.level}</span>`:''}${e.count?`<span class="pill">Dose #${e.count}</span>`:''}${e.duration?`<span class="pill">${e.duration}s audio</span>`:''}</div>`}).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('logPain').onclick=()=>{let n=Math.max(0,Number($('pain').value||0));add('pain',{level:n})};document.querySelectorAll('[data-pain]').forEach(b=>b.onclick=()=>{$('pain').value=b.dataset.pain;add('pain',{level:Number(b.dataset.pain)})});
$('meds').innerHTML=meds.map((m,i)=>`<button class="med" data-med="${m[0]}"><strong>${m[0]}</strong><span>Tap once per dose</span></button>`).join('');
document.querySelectorAll('.med').forEach(b=>b.onclick=()=>{const med=b.dataset.med;const count=data.filter(e=>e.type==='med'&&e.med===med&&new Date(e.time).toDateString()===new Date().toDateString()).length+1;add('med',{med,count})});
$('saveNote').onclick=()=>{const t=$('note').value.trim();if(t){add('note',{text:t});$('note').value=''}};
$('speechBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Speech-to-text is not available in this browser');return}if(recognition){recognition.stop();return}recognition=new SR();recognition.continuous=true;recognition.interimResults=false;recognition.lang='en-NZ';recognition.onstart=()=>{$('speechBtn').textContent='⏹️ Stop speech note'};recognition.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';$('note').value+=s};recognition.onend=()=>{$('speechBtn').textContent='🗣️ Start speech note';recognition=null};recognition.start()};
$('voiceBtn').onclick=async()=>{if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}if(!navigator.mediaDevices?.getUserMedia){toast('Audio recording is not available here');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);const started=Date.now();mediaRecorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const duration=Math.round((Date.now()-started)/1000);add('voice',{duration});$('voiceBtn').textContent='🎙️ Hold to record voice'};mediaRecorder.start();$('voiceBtn').textContent='⏹️ Stop recording';}catch(e){toast('Microphone permission was not granted')}};
$('clearToday').onclick=()=>{if(confirm('Delete only today\'s entries?')){const d=new Date().toDateString();data=data.filter(e=>new Date(e.time).toDateString()!==d);save();render()}};
$('deleteAll').onclick=()=>{if(confirm('Delete every saved diary entry from this device?')){data=[];save();render()}};
$('export').onclick=()=>{const text=data.map(e=>`${new Date(e.time).toLocaleString()} | ${e.type==='pain'?'Pain '+e.level:e.type==='med'?e.med+' dose #'+e.count:e.type==='voice'?'Voice recording '+e.duration+'s':'Note: '+(e.text||'')}`).join('\n');const blob=new Blob([text||'No entries'],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pain-diary.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
</script></body></html>
